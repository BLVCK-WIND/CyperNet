# ==========================================
# DEVELOPMENT ENVIRONMENT CONFIGURATION (DEV)
# ==========================================

# Database Configuration (Local MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/tiemnet_db
spring.datasource.username=root
spring.datasource.password=123

# JPA & Hibernate (Rapid Prototyping)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration (Dev Secret)
jwt.secret=cybernet-secret-key-phai-dai-it-nhat-256-bit-de-dam-bao-an-toan-hmac-sha256
jwt.access-token-expiration-ms=1800000
jwt.refresh-token-expiration-ms=604800000

# Swagger UI (Enabled in Dev)
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true

# Actuator (Show full details in Dev)
management.endpoint.health.show-details=always

# Logging Level
logging.level.com.cybernet=DEBUG

# Real-time WebSocket (Disabled for MVP)
websocket.enabled=false

# CORS Configuration (Dev allows LAN IPs)
cors.allowed-origin-patterns=http://localhost:[*],http://127.0.0.1:[*],http://192.168.*:[*],http://10.*:[*],http://172.16.*:[*],http://172.17.*:[*],http://172.18.*:[*],http://172.19.*:[*],http://172.20.*:[*],http://172.21.*:[*],http://172.22.*:[*],http://172.23.*:[*],http://172.24.*:[*],http://172.25.*:[*],http://172.26.*:[*],http://172.27.*:[*],http://172.28.*:[*],http://172.29.*:[*],http://172.30.*:[*],http://172.31.*:[*]

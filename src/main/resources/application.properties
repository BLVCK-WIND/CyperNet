spring.application.name=internet-cafe-management

# === Active Profile (Mặc định: dev) ===
spring.profiles.active=dev

# === Web Pagination Limits ===
spring.data.web.pageable.max-page-size=100

# === OpenAPI 3 & Swagger UI (Common) ===
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.display-request-duration=true
springdoc.show-actuator=true

# === Spring Boot Actuator (Common) ===
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true
management.info.git.mode=full

# === Database Migration (Flyway) ===
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

# === CORS Configuration ===
cors.allowed-origin-patterns=http://localhost:[*],http://127.0.0.1:[*]

# ==========================================
# PRODUCTION ENVIRONMENT CONFIGURATION (PROD)
# ==========================================

# Database Configuration (Environment variables with defaults)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/tiemnet_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123}

# HikariCP Connection Pool Tuning for Production
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000

# JPA & Hibernate (Strict Validation - NO automatic alter table on Production)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# JWT Configuration (Environment variable required in production)
jwt.secret=${JWT_SECRET:cybernet-secret-key-phai-dai-it-nhat-256-bit-de-dam-bao-an-toan-hmac-sha256}
jwt.access-token-expiration-ms=${JWT_EXPIRATION_MS:1800000}
jwt.refresh-token-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# Swagger UI (Disabled by default on Production for security)
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}
springdoc.api-docs.enabled=${API_DOCS_ENABLED:false}

# Actuator (Never leak sensitive DB/system info to public in Production)
management.endpoint.health.show-details=never

# Logging Level
logging.level.com.cybernet=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN

# Real-time WebSocket (Disabled by default for MVP on Production)
websocket.enabled=${WEBSOCKET_ENABLED:false}

# CORS Configuration (Strict origins for production)
cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGINS:https://tiemnet.cybernet.vn,https://admin.cybernet.vn}

services:
  # ----------------------------------------------------------------------------
  # MySQL 8.0 Database Service
  # ----------------------------------------------------------------------------
  db:
    image: mysql:8.0
    container_name: cybernet-mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${DB_NAME:-tiemnet_db}
      MYSQL_USER: ${DB_USERNAME:-tiemnet_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-cybernet_secret_pass_123}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-cybernet_root_pass_456}
    ports:
      # Map to host port 3307 to avoid collision with any existing host MySQL instance
      - "${HOST_DB_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - cybernet-net
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$MYSQL_ROOT_PASSWORD --silent || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ----------------------------------------------------------------------------
  # CyberNet Spring Boot Application Service
  # ----------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cybernet-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SERVER_PORT: ${SERVER_PORT:-8080}
      DB_URL: ${DB_URL:-jdbc:mysql://db:3306/tiemnet_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh}
      DB_USERNAME: ${DB_USERNAME:-tiemnet_user}
      DB_PASSWORD: ${DB_PASSWORD:-cybernet_secret_pass_123}
      JWT_SECRET: ${JWT_SECRET:-CyberNetSecretKeyForJwtAuthenticationMustBeAtLeast256BitsLong2026!}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      JWT_REFRESH_EXPIRATION_MS: ${JWT_REFRESH_EXPIRATION_MS:-604800000}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
    ports:
      - "${SERVER_PORT:-8080}:8080"
    volumes:
      - app-logs:/app/logs
    networks:
      - cybernet-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

volumes:
  mysql-data:
    driver: local
  app-logs:
    driver: local

networks:
  cybernet-net:
    driver: bridge
